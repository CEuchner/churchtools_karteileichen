<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Karteileichen - ChurchTools Extension</title>
        <link rel="stylesheet" href="/src/styles.css" />
    </head>
    <body>
        <div class="container">
            <h1>🪦 Karteileichen</h1>
            <p class="subtitle">Finde Personen in einer Gruppe, die in einem bestimmten Zeitraum in bestimmten Diensten nicht aktiv waren</p>
            
            <div class="form-section">
                <div class="form-column-left">
                    <div class="form-group">
                        <label for="groupSelect">Gruppe *</label>
                        <select id="groupSelect" disabled>
                            <option value="">-- Gruppe wählen --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Dienste *</label>
                        <div id="serviceCheckboxes" class="service-checkboxes">
                            <p style="color: #999; font-size: 14px;">Dienste werden geladen...</p>
                        </div>
                    </div>
                </div>

                <div class="form-column-right">
                    <div class="form-group">
                        <label>Zeitraum</label>
                        <div class="date-range">
                            <div class="form-group">
                                <label for="dateFrom" style="margin-bottom: 0;">Von</label>
                                <input type="date" id="dateFrom" />
                                <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
                                    <button type="button" class="btn-quick btn-quick-from" data-months="3">vor 3M</button>
                                    <button type="button" class="btn-quick btn-quick-from" data-months="6">vor 6M</button>
                                    <button type="button" class="btn-quick btn-quick-from" data-months="12">vor 12M</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="dateTo" style="margin-bottom: 0;">Bis</label>
                                <input type="date" id="dateTo" />
                                <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
                                    <button type="button" class="btn-quick btn-quick-to" data-months="0">Heute</button>
                                    <button type="button" class="btn-quick btn-quick-to" data-months="1">+1M</button>
                                    <button type="button" class="btn-quick btn-quick-to" data-months="2">+2M</button>
                                    <button type="button" class="btn-quick btn-quick-to" data-months="3">+3M</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="searchBtn" class="btn-primary" disabled>🔍 Inaktive finden</button>
                <button id="resetBtn" class="btn-secondary">Zurücksetzen</button>
            </div>

            <div id="statusMessage" class="status-message" style="display: none;"></div>

            <div id="resultsSection" class="results-section">
                <div class="results-header">
                    <h2>Ergebnisse</h2>
                    <div class="results-header-right">
                        <div class="result-count"><span id="resultCount">0</span> Personen</div>
                        <label class="select-all">
                            <span>Alle auswählen</span>
                            <input type="checkbox" id="selectAllResults" />
                        </label>
                    </div>
                </div>
                <div id="personList" class="person-list"></div>
                <div class="action-buttons">
                    <button id="addToGroupBtn" class="btn-primary">➕ Zu Gruppe hinzufügen</button>
                </div>
            </div>
        </div>
        <!-- Modal for selecting target group -->
        <div id="groupModal" class="modal-overlay">
            <div class="modal-content">
                <h3>Zu Gruppe hinzufügen</h3>
                <div class="form-group">
                    <label for="targetGroupSelect">Zielgruppe auswählen:</label>
                    <select id="targetGroupSelect"></select>
                </div>
                <div class="modal-buttons">
                    <button id="modalCancelBtn" class="btn-secondary">Abbrechen</button>
                    <button id="modalConfirmBtn" class="btn-primary">Hinzufügen</button>
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
